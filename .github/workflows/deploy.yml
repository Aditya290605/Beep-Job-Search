name: CI/CD — Test & Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: my-project-002-515013
  REGION: asia-south1
  AR_REPO: beep-repo
  IMAGE_NAME: beep-app
  SERVICE_NAME: beep-job-hub
  JOB_NAME: beep-refresh-job

jobs:
  test:
    name: Run Unit Tests & JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backend unit tests
        run: python3 -m unittest discover -v backend/tests

      - name: Validate frontend JS syntax
        run: node -c frontend/assets/app.js

  deploy:
    name: Build & Deploy Cloud Run Service + Job
    needs: test
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy Cloud Run Service (beep-job-hub)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --quiet

      - name: Update Cloud Run Scheduled Job (beep-refresh-job)
        run: |
          gcloud run jobs update ${{ env.JOB_NAME }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --task-timeout 900s \
            --quiet

      - name: Post-deploy smoke test (/api/health & /api/jobs)
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "Testing live deployment at $SERVICE_URL ..."
          curl -fsSL "$SERVICE_URL/api/health" | tee /dev/stderr | grep -q '"db_connected":true'
          curl -fsSL "$SERVICE_URL/api/jobs?limit=1" | grep -q '"jobs":'
          echo "Deployment verified healthy!"
